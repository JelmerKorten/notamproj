name: Test & Lint

on:
  push:
    paths:
      - "notamplotter/**"
      - "pyproject.toml"
      - "config.yaml"
      - ".env.example"
      - ".github/workflows/test.yml"
  pull_request:
    paths:
      - "notamplotter/**"
      - "pyproject.toml"
      - "config.yaml"
      - ".env.example"
      - ".github/workflows/test.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Import check
        run: python -c "import notamplotter, notamplotter.cli, notamplotter.plot, notamplotter.fetch, notamplotter.config"
