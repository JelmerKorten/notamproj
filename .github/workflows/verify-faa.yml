name: Verify-FAA-Reachability

on:
  workflow_dispatch:
  push:
    branches: [verify/faa-reachability]

jobs:
  verify:
    name: Probe FAA API from a GitHub runner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install curl-cffi
        run: pip install "curl-cffi==0.16.0"

      - name: Probe FAA endpoint
        run: python - <<'EOF'
import sys
from curl_cffi import requests as creq

BASE = "https://notams.aim.faa.gov/notamSearch"
DESIGNATORS = "OMAA,OMAE,OMAD,OMAM"

s = creq.Session(impersonate="chrome")
r_get = s.get(f"{BASE}/", timeout=30)
print(f"[probe] GET  {BASE}/      -> {r_get.status_code}", flush=True)
r_post = s.post(
    f"{BASE}/search",
    data={
        "searchType": "0",
        "designatorsForLocation": DESIGNATORS,
        "offset": "0",
        "notamsOnly": "false",
    },
    headers={"Content-Type": "application/x-www-form-urlencoded"},
    timeout=30,
)
print(f"[probe] POST {BASE}/search -> {r_post.status_code}", flush=True)
try:
    body = r_post.json()
    print(f"[probe] JSON totalNotamCount = {body.get('totalNotamCount')}", flush=True)
except Exception as exc:
    print(f"[probe] JSON parse failed ({type(exc).__name__}); body head: {r_post.text[:300]!r}", flush=True)

if r_get.status_code != 200 or r_post.status_code != 200:
    print("FAIL: non-200 from FAA endpoint", flush=True)
    sys.exit(1)
EOF

      - name: Run real FaaClient path
        run: python - <<'EOF'
import sys
from notamplotter.fetch import FaaClient

try:
    client = FaaClient()
    notams = client.fetch_all(["OMAA", "OMAE", "OMAD", "OMAM"])
    print(f"[client] FaaClient.fetch_all OK: fetched {len(notams)} notams", flush=True)
    assert notams, "no notams returned"
except Exception as exc:
    print(f"[client] FaaClient.fetch_all FAILED: {type(exc).__name__}: {exc}", flush=True)
    sys.exit(1)
EOF
