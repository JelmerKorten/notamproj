name: Daily NOTAM

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e .

      - name: Fetch NOTAMs
        run: notamplotter fetch
        env:
          NOTAM_AIRPORTS: ${{ secrets.NOTAM_AIRPORTS }}

      - name: Write plot overlay
        run: printf '%s' "$PLOT_OVERLAY" > plot_overlay.json
        env:
          PLOT_OVERLAY: ${{ secrets.PLOT_OVERLAY }}

      - name: Build HTML plot
        run: notamplotter plot "$(ls -t files/*_notams_*.csv | head -1)"
        env:
          NOTAM_AIRPORTS: ${{ secrets.NOTAM_AIRPORTS }}

      - name: Email NOTAMs
        continue-on-error: true
        run: notamplotter email
        env:
          SMTP_HOST: smtp.gmail.com
          SMTP_PORT: "587"
          SMTP_USER: ${{ secrets.GMAIL_USER }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: notam-output
          path: |
            output/*.html
            files/*_notams_*.csv
          retention-days: 7
