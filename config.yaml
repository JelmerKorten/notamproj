# NotamPlotter default configuration.
# Values here are overridden by environment variables (see .env.example).
# File is optional: NotamPlotter works out of the box without it.

# Default airports to fetch/plot.
airports:
  - EHAM
  - NZSP
  - VHHH
  - SEQM

# Output paths (relative to the project root).
files_dir: files
output_dir: output

# Root logging level.
log_level: INFO

# MapLibre basemap style URL. OpenFreeMap is OSM-derived, needs no API key and
# has no request limits. Do not point this at tile.openstreetmap.org for
# automated/app use (their tile policy forbids it).
map_style: https://tiles.openfreemap.org/styles/liberty

# FAA API base URL (no key required).
faa_api_base_url: https://notams.aim.faa.gov/notamSearch

# Email settings (Phase 4). All values can come from env vars instead.
email:
  smtp_host: ""
  smtp_port: 587
  smtp_user: ""
  email_from: ""
  email_to: ""
