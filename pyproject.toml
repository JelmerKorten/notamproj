[project]
name = "notamproj"
version = "0.1.5"
description = "notamp plotter project"
authors = [
    {name = "JelmerKorten"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "arrow==1.3.0",
    "customtkinter==5.2.2",
    "numpy==2.3.0",
    "pandas==2.3.0",
    "plotly==6.1.2",
    "pypdf==5.6.1",
    "pyproj==3.7.1",
    "python-dateutil==2.9.0.post0",
    "python-dotenv==1.0.1",
    "PyYAML==6.0.2",
    "requests==2.32.4",
    "selenium==4.33.0",
    "shapely==2.1.1"
]


[tool.ruff]
line-length = 120
target-version = "py313"
exclude = ["deprecated"]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
